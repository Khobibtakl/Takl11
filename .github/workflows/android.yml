name: Build KhubaibTakl APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2. Java
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "zulu"

      # 3. Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 4. Install packages
      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # 5. Build web
      - name: Build Web App
        run: |
          npm run build

          if [ ! -d "dist" ]; then
            echo "dist folder not found"
            exit 1
          fi

      # 6. Capacitor setup
      - name: Setup Capacitor
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            echo '{
              "appId": "khubaibtakl.helper.af",
              "appName": "همکار خبيب تکل",
              "webDir": "dist"
            }' > capacitor.config.json
          fi

          npx cap add android || true
          npx cap copy android
          npx cap sync android

      # 7. Fix Kotlin conflict
      - name: Fix Kotlin Conflict
        run: |
          cat >> android/build.gradle << 'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
                  }

                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
              }
          }
          EOF

      # 8. Android config
      - name: Fix Android Config
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml

      # 9. Build APK
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KhubaibTakl-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
