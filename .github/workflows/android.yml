name: Build KhubaibTakl APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Get source code
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2. Java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      # 3. Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 4. Install dependencies
      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # 5. Build web app (important for white screen fix)
      - name: Build Web App
        run: |
          npm run build

          if [ ! -d "dist" ]; then
            echo "ERROR: dist folder not found"
            exit 1
          fi

      # 6. Create capacitor config if missing
      - name: Create Capacitor Config
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            echo '{
              "appId": "khubaibtakl.helper.af",
              "appName": "همکار خبيب تکل",
              "webDir": "dist"
            }' > capacitor.config.json
          fi

      # 7. Sync Android files
      - name: Capacitor Sync
        run: |
          npx cap add android || true
          npx cap copy android
          npx cap sync android

      # 8. Fix AndroidManifest (network/white screen fix)
      - name: Android Config Fix
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml

      # 9. Build APK
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KhubaibTakl-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
