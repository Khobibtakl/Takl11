name: Build KhubaibTakl APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # Checkout project
      - name: Checkout Source
        uses: actions/checkout@v4

      # Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      # Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install packages (npm ci problem fixed)
      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets @capacitor/share @capacitor/filesystem

      # Build web files
      - name: Build Web App
        run: npm run build || true

      # Capacitor Android setup
      - name: Setup Capacitor Android
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            npx cap init "همکار خبيب تکل" "khubaibtakl.helper.af" --web-dir dist
          fi

          npx cap add android || true
          npx cap sync android

      # Generate icon if logo exists
      - name: Generate App Icon
        run: |
          if [ -f "logo.png" ]; then
            mkdir -p assets
            cp logo.png assets/icon.png
            npx capacitor-assets generate --android
          else
            echo "logo.png not found."
          fi

      # Optimize Gradle
      - name: Optimize Gradle
        run: |
          cd android
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=true" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties

      # Build APK
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KhubaibTakl-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
